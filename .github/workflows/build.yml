name: Blutter (разбор Dart-кода лаунчера)
on: workflow_dispatch

jobs:
  blutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-requests git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev unzip zip

      - name: Распаковать вход
        run: |
          mkdir -p in
          unzip -q Blutter.zip -d in
          ls -la in/arm64-v8a

      - name: Blutter
        run: |
          git clone --depth 1 https://github.com/worawit/blutter
          cd blutter
          # у Xiaomi свой Dart: хеш снапшота не совпадает со стоковым 3.10.1 -> подставляем хеш из самого libapp.so
          export SNAPSHOT_HASH=$(python3 -c "from extract_dart_info import extract_snapshot_hash_flags as f; print(f('../in/arm64-v8a/libapp.so')[0])")
          echo "snapshot hash: $SNAPSHOT_HASH"
          sed -i 's/dart_info = DartLibInfo(version, os_name, arch)$/dart_info = DartLibInfo(version, os_name, arch, None, os.environ.get("SNAPSHOT_HASH"))/' blutter.py
          grep -n SNAPSHOT_HASH blutter.py
          python3 blutter.py ../in/arm64-v8a/libapp.so ../out --dart-version 3.10.1_android_arm64 2>&1 | tee ../blutter.log
          
      - name: Выбрать нужные файлы
        if: always()
        run: |
          mkdir -p small
          cp blutter.log small/ || true
          ls -la out || true
          if [ -d out/asm ]; then
            grep -rlE "clickIcon blocked|shouldCancelAnimImmediately|skip iconClick|handlePreStartup blocked|isLaunchingNewTask|canUseBreakOpenAnim|cancelAnimImmediately|openingRemoteAnimationOpen" out/asm > small/files.txt || true
            while read f; do mkdir -p "small/$(dirname "$f")"; cp "$f" "small/$f"; done < small/files.txt
          fi
          cp out/pp.txt small/ 2>/dev/null || true
          (cd small && zip -qr ../relevant.zip .)
          ls -la relevant.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relevant
          path: relevant.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blutter_full
          path: out
          retention-days: 3
