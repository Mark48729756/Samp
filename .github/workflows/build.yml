name: ANVIL ENGINE M100 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install GLAD dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install Jinja2

      - name: Extract ANVIL ENGINE M100
        shell: pwsh
        run: |
          $archive = "ANVIL-Engine-M100-AUDIT-FIXED.zip"

          if (!(Test-Path $archive)) {
            Write-Error "ANVIL ENGINE M100 archive not found!"
            exit 1
          }

          Expand-Archive -Path $archive -DestinationPath extracted -Force

          $source = "extracted/anvil_m58"

          if (!(Test-Path "$source/CMakeLists.txt")) {
            Write-Error "M100 CMakeLists.txt not found!"
            Get-ChildItem extracted -Recurse
            exit 1
          }

          Write-Host "ANVIL ENGINE M100 extracted successfully."

      - name: Configure
        shell: pwsh
        run: |
          cmake -S extracted/anvil_m58 -B build -A x64 `
            -DBUILD_TESTING=ON 2>&1 |
            Tee-Object configure.log

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 |
            Tee-Object build.log

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ANVIL ENGINE M100 build failed!"
            Select-String -Path build.log -Pattern "error C[0-9]+|fatal error|FAILED|LNK[0-9]+"
            exit 1
          }

      - name: Run Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 |
            Tee-Object tests.log

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ANVIL ENGINE M100 tests failed!"
            exit 1
          }

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANVIL-ENGINE-M100-WINDOWS-x64
          path: |
            build/Release/*.exe
            build/Release/*.dll
            build/editor/Release/*.exe
            build/editor/Release/*.dll
            build/sandbox/Release/*.exe
            build/sandbox/Release/*.dll
          if-no-files-found: warn

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANVIL-ENGINE-M100-BUILD-LOGS
          path: |
            configure.log
            build.log
            tests.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
