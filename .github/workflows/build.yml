name: Build APKs
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: LiquidClock,      name: Clock }
          - { dir: LiquidCalculator, name: Calculator }
          - { dir: LiquidGallery,    name: Gallery }
          - { dir: LiquidFiles,      name: Files }
          - { dir: LiquidRecorder,   name: Recorder }
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip archives from repo root (if any)
        run: |
          shopt -s nullglob
          for z in *.zip; do echo "Unpacking $z"; unzip -oq "$z" -x '.github/*'; done
      - name: Check project exists
        id: chk
        run: |
          if [ -f "${{ matrix.dir }}/settings.gradle.kts" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::${{ matrix.dir }} not found, skipping"; fi
      - uses: actions/setup-java@v4
        if: steps.chk.outputs.ok == 'true'
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        if: steps.chk.outputs.ok == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        if: steps.chk.outputs.ok == 'true'
        with: { gradle-version: 8.13 }
      - name: Build release APK
        if: steps.chk.outputs.ok == 'true'
        working-directory: ${{ matrix.dir }}
        run: gradle assembleRelease --no-daemon
      - name: Collect APK
        if: steps.chk.outputs.ok == 'true'
        run: cp ${{ matrix.dir }}/app/build/outputs/apk/release/app-release.apk ${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          name: apk-${{ matrix.name }}
          path: ${{ matrix.name }}.apk
          compression-level: 0

  package:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      # склеивает все apk-* в один артефакт LiquidApps и удаляет промежуточные
      - uses: actions/upload-artifact/merge@v4
        with:
          name: LiquidApps
          pattern: apk-*
          delete-merged: true
      - uses: actions/download-artifact@v4
        with:
          name: LiquidApps
          path: apks
      - name: Zip all APKs
        run: cd apks && zip -q ../LiquidApps.zip *.apk && ls -la ../LiquidApps.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: LiquidApps.zip
