
name: ANVIL ENGINE M41 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Locate CMakeLists
        id: locate
        shell: pwsh
        run: |
          Write-Host "Repository structure:"
          Get-ChildItem -Force

          $files = Get-ChildItem -Path . -Filter CMakeLists.txt -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(build|\.git)\\' }

          if (-not $files) {
            Write-Error "CMakeLists.txt NOT FOUND!"
            exit 1
          }

          $cmakeFile = $files | Select-Object -First 1
          $sourceDir = $cmakeFile.Directory.FullName

          Write-Host "Found: $($cmakeFile.FullName)"
          Write-Host "Source directory: $sourceDir"

          "source_dir=$sourceDir" >> $env:GITHUB_OUTPUT

      - name: Configure
        shell: pwsh
        run: |
          cmake -S "${{ steps.locate.outputs.source_dir }}" -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 |
            Tee-Object build.log

          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern "error C[0-9]+|fatal error|FAILED"
            exit 1
          }

      - name: Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANVIL-M41-Build-Logs
          path: build.log
          if-no-files-found: warn
