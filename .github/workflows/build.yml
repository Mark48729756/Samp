
name: ANVIL ENGINE M41 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Extract Engine
        shell: pwsh
        run: |
          $archive = "ANVIL-Engine-M41-Neutral-Graphite.zip"

          if (!(Test-Path $archive)) {
            Write-Error "Engine archive not found!"
            exit 1
          }

          Expand-Archive -Path $archive -DestinationPath extracted -Force

          if (!(Test-Path "extracted/anvil-engine/CMakeLists.txt")) {
            Write-Error "CMakeLists.txt not found inside archive!"
            Get-ChildItem extracted -Recurse
            exit 1
          }

          Write-Host "Engine extracted successfully."

      - name: Configure
        shell: pwsh
        run: |
          cmake -S extracted/anvil-engine -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 |
            Tee-Object build.log

          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern "error C[0-9]+|fatal error|FAILED"
            exit 1
          }

      - name: Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANVIL-M41-Build-Logs
          path: |
            build.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
