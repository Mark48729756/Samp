
name: ANVIL ENGINE M41 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install GLAD dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install Jinja2

      - name: Extract Engine
        shell: pwsh
        run: |
          $archive = "ANVIL-Engine-M41-Neutral-Graphite.zip"

          if (!(Test-Path $archive)) {
            Write-Error "Engine archive not found!"
            exit 1
          }

          Expand-Archive -Path $archive -DestinationPath extracted -Force

          if (!(Test-Path "extracted/anvil-engine/CMakeLists.txt")) {
            Write-Error "CMakeLists.txt not found inside archive!"
            Get-ChildItem extracted -Recurse
            exit 1
          }

          Write-Host "Engine extracted successfully."

      - name: Configure
        shell: pwsh
        run: |
          cmake -S extracted/anvil-engine -B build -A x64 2>&1 |
            Tee-Object configure.log

          $configureExit = $LASTEXITCODE

          if ($configureExit -ne 0) {
            Write-Error "CMake configuration failed!"
            exit $configureExit
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 |
            Tee-Object build.log

          $buildExit = $LASTEXITCODE

          if ($buildExit -ne 0) {
            Write-Error "ANVIL ENGINE build failed!"
            Select-String -Path build.log -Pattern "error C[0-9]+|fatal error|FAILED|LNK[0-9]+"
            exit $buildExit
          }

      - name: Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 |
            Tee-Object tests.log

          $testExit = $LASTEXITCODE

          if ($testExit -ne 0) {
            Write-Error "ANVIL ENGINE tests failed!"
            exit $testExit
          }

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANVIL-M41-Build
          path: |
            build/Release/*.exe
            build/editor/Release/*.exe
            build/Release/*.dll
            build/editor/Release/*.dll
          if-no-files-found: warn

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANVIL-M41-Build-Logs
          path: |
            configure.log
            build.log
            tests.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
