name: Build APK from ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Найти и распаковать архив
        id: unpack
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then echo "::error::В корне репозитория нет .zip архива"; exit 1; fi
          echo "Архив: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then echo "::error::В архиве не найден settings.gradle(.kts)"; exit 1; fi
          DIR=$(dirname "$SETTINGS")
          echo "Проект: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/gradlew" ]; then echo "wrapper=true" >> "$GITHUB_OUTPUT"; else echo "wrapper=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Принять лицензии Android SDK (SDK уже есть на runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Сборка debug APK
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: |
          if [ "${{ steps.unpack.outputs.wrapper }}" = "true" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Собрать APK в одну папку
        run: |
          mkdir -p apk
          find "${{ steps.unpack.outputs.dir }}" -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} apk/ \;
          ls -la apk
          test -n "$(ls apk/*.apk)"

      - uses: actions/upload-artifact@v4
        with:
          name: KievCine-debug-apk
          path: apk/*.apk
          if-no-files-found: error
