name: Build APKs
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: LiquidGallery, apk: Gallery }
          - { app: LiquidCalculator, apk: Calculator }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Unzip project if needed
        run: |
          if ! find . -maxdepth 5 -name settings.gradle.kts -path "*${{ matrix.app }}*" -not -path './.git/*' | grep -q .; then
            for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d unpacked; done
          fi
      - name: Find Gradle project root
        run: |
          S=$(find . -maxdepth 5 -name settings.gradle.kts -path "*${{ matrix.app }}*" -not -path './.git/*' | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle.kts for ${{ matrix.app }} not found"; find . -maxdepth 4 -not -path './.git/*'; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon
      - name: Collect APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "${{ matrix.apk }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.apk }}", path: "${{ matrix.apk }}.apk" }
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: out/*.apk
          make_latest: true
