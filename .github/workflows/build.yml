name: Build Glass APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false   # подмодуль лежит внутри glass-overlay.zip обычными файлами

      - name: Unzip glass-overlay.zip over the project
        run: |
          ZIP=$(ls glass-overlay.zip lawnchair-nightly-glass.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "В корне репозитория нет glass-overlay.zip"; exit 1; fi
          echo "Распаковываю $ZIP"
          mkdir -p /tmp/glass
          unzip -oq "$ZIP" -d /tmp/glass
          # если внутри есть верхняя папка lawnchair-nightly/ - берём содержимое из неё
          SRC=/tmp/glass
          [ -d /tmp/glass/lawnchair-nightly ] && SRC=/tmp/glass/lawnchair-nightly
          rm -rf platform_frameworks_libs_systemui
          cp -a "$SRC"/. .
          test -f platform_frameworks_libs_systemui/iconloaderlib/src/com/android/launcher3/icons/FastBitmapDrawable.kt
          ls prebuilts/libs | head -3

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Lawnchair-Glass-debug
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
