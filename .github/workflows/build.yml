name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Разархивировать main.zip (если он есть)
        run: |
          if [ -f main.zip ]; then
            rm -rf _src && mkdir _src
            unzip -q -o main.zip -d _src
            S=$(find _src -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -1)
            echo "PROJECT_DIR=$S" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Скачать модель трекинга рук
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          curl -L --fail -o "$PROJECT_DIR/app/src/main/assets/hand_landmarker.task" \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Собрать APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Подготовить APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk out/HyperVR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HyperVR-apk
          path: out/HyperVR.apk

      - name: Выложить в Releases (скачать APK прямо с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HyperVR сборка ${{ github.run_number }}
          files: out/HyperVR.apk
